# niah_multiquery: RULER "many-needles, many-queries" retrieval (NIAH variant).
#
# A SYNTHETIC long-context task: lm_eval generates its own haystacks sized by
# token count, so two things are mandatory and neither is expressible in the
# task yaml alone:
#   * `--metadata '{"max_seq_lengths":[<len>]}'` picks the context length(s) to
#     build (default is 4096 only). aqa passes it from `eval.lm_eval.metadata`.
#   * a tokenizer to size them with. lm_eval merges --model_args into the task
#     metadata and resolves `tokenizer` -> `pretrained` -> `model`, so the
#     checkpoint under evaluation must ship tokenizer files (auto-round's
#     model_free export copies them).
# The task reports one metric per length bucket ("<len>,none"; other buckets are
# -1 because no sample was generated at that length), so `scoring.metric` pins
# the bucket this run asked for — keep it in sync with `max_seq_lengths`.
#
# Budget note: the generator reserves tokens_to_generate (128) inside
# max_seq_lengths. When using a completions server, send token IDs from the same
# tokenizer with add_bos_token enabled; re-tokenizing raw text on the server can
# shift the boundary prompt length and exceed the model's context window. lm_eval
# appends gen_prefix after dataset sizing, so its API adapter may left-truncate
# a few prompt tokens to keep the request within max_model_len.
name: niah_multiquery
harness: lm_eval
type: generative

apply_chat_template: true      # instruct/thinking model: measure it in its chat format
fewshot_as_multiturn: false    # 0-shot by construction, nothing to feed as prior turns
num_fewshot: 0
gen_kwargs: { max_gen_toks: 128 }   # matches the task's internal reserve
batch_size: "2"                # 128k-token prompts: keep in-flight requests small

scoring:
  metric: "131072,none"
  prefer: ["131072,none"]

description: RULER multi-query needle-in-a-haystack (synthetic long context, per-length metric).
