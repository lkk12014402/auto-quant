# Qwen3.5-35B-A3B — bf16 的 evalscope 补测（aime25 + gpqa_diamond，avg@5）
# 独立 eval-only run。35B 的三条已验证经验直接写进配置，避免重演 9B 的坑：
#   1) eval-only 走 pretrained provider，不经过 resolve_export_dir ⇒ model 必须指向
#      **真实导出目录**（autoround 会嵌套 quantized/<model>-mxfp-wNg32/）。
#   2) port 逐档错开（EvalScopeHarness 默认 8801，并行必撞）。
#   3) artifact_name 显式指定，否则 eval-only 无 quant 块会被命名成 -BF16-Baseline，
#      在 dataset 上造出重复目录。
# thinking 走 evalscope 默认（开思考链），与 lm_eval 的 non-thinking 分表呈现，不跨表算 Ratio。
model: /models/Qwen3.5-35B-A3B

eval:
  backend: vllm
  benchmarks: [aime25, gpqa_diamond]
  baseline: false
  thinking: "auto"
  evalscope:
    repeats: 5
    port: 8805
    eval_batch_size: 32
    server_args:
      # 显存策略：gpu_memory_utilization 是相对**总显存**的目标占用，须同时覆盖
      #   权重+激活+KV+graph。本档是 **BF16 原模型（72 GB 权重）**，量化的 0.30（82 GB）
      #   只剩 10 GB 给 KV/激活/graph，会报 No available memory for the cache blocks；
      #   本卡独占跑，直接给 0.75（≈206 GB）。量化档仍用 0.30（权重 36 GB，实测
      #   KV=1,407,534 tokens 富余），两边分数口径不受影响（util 只影响 KV 大小与吞吐）。
      # 其余吞吐参数与量化档保持一致：32768 / 128 / 保留 CUDA graph。
      # prefetch 必开：checkpoint 在 CEPH 上，vLLM 默认对 CEPH 关预取，
      # 实测权重装载 2227 s -> 53 s（vLLM 日志自己给的解法）。
      gpu_memory_utilization: 0.75
      max_num_batched_tokens: 32768
      max_num_seqs: 128
      max_model_len: 40960
      safetensors_load_strategy: prefetch

executor:
  type: local
  num_gpus: 1
  env:
    type: venv
    path: /models/miniforge3/envs/muse_new
    create: false
    packages: []

output:
  dir: ./results/qwen3_5_35b_a3b/bf16_evalscope
  unique_dir: true
  report_model: Qwen/Qwen3.5-35B-A3B
  artifact_name: Qwen3.5-35B-A3B-BF16-Baseline
  sinks:
    - type: local_fs
    - type: hf_dataset
      repo: ${LOCAL_RESULTS_DATASET:-lvkaokao/lb_local}
      token_env: LOCAL_RESULTS_HF_TOKEN

agent:
  fix_loop: false
