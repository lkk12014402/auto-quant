# Qwen3.5-9B — MXFP4 v1 保守档（ignore 探索）
model: /models/Qwen3.5-9B

quant:
  scheme: MXFP4
  method: model_free
  export_format: llm_compressor
  ignore_layers: "lm_head,embed_tokens,visual,in_proj_a,in_proj_b,conv1d,gate_proj,up_proj,self_attn"

provider:
  type: quantize

eval:
  backend: vllm
  benchmarks: [gsm8k, piqa, mmlu, hellaswag]
  batch_size: "64"
  baseline: false
  thinking: auto
  lm_eval:
    model_args:
      max_model_len: 8192
      max_num_batched_tokens: 32768
      max_num_seqs: 128
      gpu_memory_utilization: 0.5
      enable_thinking: false
      reasoning_parser: qwen3
    group: false

executor:
  type: local
  num_gpus: 1
  env:
    type: venv
    path: /models/miniforge3/envs/lkk
    create: false
    packages: auto

output:
  dir: ./results/qwen3_5_9b_mxfp4_conservative
  unique_dir: true
  sinks:
    - type: local_fs
    - type: hf_dataset
      repo: ${LOCAL_RESULTS_DATASET:-lvkaokao/lb_local}
      token_env: LOCAL_RESULTS_HF_TOKEN

agent:
  fix_loop: false
  knowledge:
    repo: ${LOCAL_RESULTS_DATASET:-lvkaokao/lb_local}
    token_env: LOCAL_RESULTS_HF_TOKEN
