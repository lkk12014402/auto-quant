# WISE_Verified (world-knowledge T2I, binary judge) eval-only template.
# NOTE: `model` is a placeholder -- replace with a local DiT checkpoint dir.
# The judge is served out-of-band, e.g.:
#   vllm serve Qwen/Qwen3.5-35B-A3B --served-model-name Qwen/Qwen3.5-35B-A3B --port 8000
model: example/diffusion-model
eval:
  benchmarks: [wise]   # official weighted overall WiScore (0..1)
  backend: vllm_omni
  harness: diffusion
  diffusion:
    num_inference_steps: 8
    guidance_scale: 0.0
    height: 1024
    width: 1024
    seed: 42
output:
  dir: ./results/wise
  sinks:
    - type: local_fs
