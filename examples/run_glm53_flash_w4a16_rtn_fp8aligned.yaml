# GLM-5.3-Flash W4A16 RTN **激进版**：量化范围对齐官方 FP8（experts +
# shared_experts + 稀疏 MLA 大投影 + dense MLP 三项）。
# 与保守版（run_glm53_flash_w4a16_rtn.yaml）的唯一差异在 ignore_layers：
# 放开了 shared_experts / dense MLP / 稀疏 MLA 大投影。
# 实证后的等价收敛：MLA 大投影被 vllm INC 拒载（坑④）回收 ignore 后，
# `self_attn` 整段保护 + 非锚定 `b_proj` 与逐项展开完全等价（全索引模拟验证，
# 量化集 37290 键一致）；`mlp.gate.`（带尾点）仍需保留——保护路由器且不误伤
# dense 的 gate_proj。
model: /home/kaokaolv/models/GLM-5.3-Flash-BF16

quant:
  scheme: W4A16
  method: model_free
  export_format: auto_round
  ignore_layers: "lm_head,embed_tokens,visual,hc_,indexer,self_attn,mlp.gate.,eh_proj,enorm,hnorm,shared_head,norm,A_log,dt_bias,b_proj,f_a_proj,f_b_proj,g_a_proj,g_b_proj,conv1d"
  # 范围：experts + shared_experts（+ dense MLP 被 auto-round GLM 预置规则强制保留）。
  # 实证边界：稀疏 MLA 的 q_a/q_b/kv_a 投影被 vllm INC 建成普通层（不支持其量化），
  # 量化它们会 KeyError qweight——故回收到 ignore。回收后逐项展开与 `self_attn` 整段
  #  ignore 等价（已对全索引模拟验证：两份清单命中集完全一致），故用短形式。

eval:
  benchmarks: [piqa, hellaswag, mmlu, gsm8k]
  backend: vllm
  batch_size: auto
  baseline: false             # baseline 复用 RTN 保守线的（mean 0.8827）
  harness: lm_eval
  lm_eval:
    model_args:
      enable_thinking: false
      reasoning_parser: glm45
      max_num_seqs: 256       # KDA/Mamba 缓存块约束（坑①）
    group: true
    seed: 42

gate:
  min_accuracy: 0.87          # 参照 baseline 0.8827

agent:
  optimize: false
  fix_loop: false

executor:
  type: local
  num_gpus: 4                 # 0-3 号卡（6/7 在跑 tuning）；W4A16 约 200GB，TP4 每卡 ~50GB
  image:
    gpu: vllm/vllm-openai:glm53-flash-x86_64-cu130
  env:
    type: docker
    packages: [auto-round, lm-eval, datasets, pillow]
    mounts:
      - /home/kaokaolv/models:/home/kaokaolv/models

output:
  dir: /home/kaokaolv/aqa_results/glm53_flash_day0/rtn_fp8aligned
  unique_dir: true
  sinks:
    - type: local_fs
