# ─────────────────────────────────────────────────────────────────────────────
# Qwen3.8-27B (VL) — AutoRound *v2* variant (SignRound + algorithm extension).
#
# Same model-load tuning path as `_tuning`, plus `--enable_alg_ext` (AutoRound v2 /
# the alg-ext SignRound improvement). The extension only applies to the `auto_round`
# block-quantizer and gives the largest gains at LOW bit-width (W2A16); at W4A16 the
# uplift is smaller but still positive. For the strongest (slowest) recipe bump
# `iters` to 1000 (auto-round-best).
#   auto-round --model_name Qwen/Qwen3.8-27B --scheme W4A16 --algorithm auto_round \
#     --enable_alg_ext --iters 200 --nsamples 128 \
#     --ignore_layers lm_head,embed_tokens,visual \
#     --format llm_compressor --output_dir <OUT>
#
# Secrets come ONLY from env vars (source a git-ignored `env.sh`; see run_5000.md).
# ─────────────────────────────────────────────────────────────────────────────

model: Qwen/Qwen3.8-27B

quant:
  scheme: W4A16                # --scheme W4A16 (v2 uplift is largest at W2A16)
  method: autoround            # model-load path (tuning; NOT --model_free)
  algorithm: auto_round        # --algorithm auto_round (required for --enable_alg_ext)
  enable_alg_ext: true         # --enable_alg_ext: AutoRound v2 SignRound extension
  iters: 200                   # --iters 200 (bump to 1000 for auto-round-best)
  nsamples: 128                # --nsamples 128: calibration samples for tuning
  export_format: llm_compressor  # --export-format llm_compressor
  # Qwen3.8-27B is a VL model: keep the vision tower + head/embeddings in full
  # precision. Substring match, so `visual` covers all `visual.*` submodules.
  ignore_layers: "lm_head,embed_tokens,visual"

# Push the quantized checkpoint to a HF *model* repo after a successful eval.
# (Top-level `quant:` above is folded into this quantize provider by the loader.)
provider:
  type: quantize
  upload:
    repo: LeaderboardModel1          # HF org/owner to create the model repo under
    repo_name: Qwen3.8-27B-AutoRound-W4A16-v2   # repo id under `repo`
    token_env: INC4AI_HF_TOKEN       # model-upload token (export before `aqa run`)
    private: false
    model_card: true                 # auto-generate a README model card
    # disable_xet: true              # uncomment if a valid write token hits a Xet 403

eval:
  benchmarks: [piqa, hellaswag, mmlu, gsm8k]  # --eval-tasks
  #benchmarks: [piqa]
  backend: vllm
  batch_size: auto
  baseline: true               # --eval-baseline (also eval the bf16 original)
  harness: lm_eval             # default harness (lm_eval | evalscope | native)
  lm_eval:
    # Extra `--model_args` appended to the vllm backend defaults (user overrides
    # win). Qwen3 reasoning models: disable thinking + set the reasoning parser.
    model_args:
      enable_thinking: false
      reasoning_parser: qwen3
    group: true                # piqa+hellaswag+mmlu run in ONE lm_eval call;
                               # gsm8k runs separately because its recipe
                               # (recipes/benchmarks/gsm8k.yaml) sets
                               # apply_chat_template + fewshot_as_multiturn +
                               # num_fewshot:5 + batch_size:"64".
    seed: 42

gate:
  max_accuracy_drop: 0.01      # NO-GO if W4A16 drops > 1 pt vs the bf16 baseline

agent:
  optimize: true               # --agent-optimize (analyse model -> quant recipe).
                               # scheme/method/algorithm/enable_alg_ext/iters/
                               # ignore_layers above are operator-fixed HARD
                               # constraints; the agent may only fill the gaps.
  fix_loop: true               # root-cause + fix + retry failing phases
  context: "@gpu_context.txt"  # --agent-context (CUDA / NGC environment notes)
  tiers: [opus]                # escalation ladder; run_5000.sh sets AGENT_TIERS="opus"
  patch:
    capture: true              # save any auto-round fix as a patch with the run
  knowledge:
    # Shared, persistent fix-knowledge: lessons + replayable patches keyed by
    # error signature, reused across runs AND different models. Pointed at the
    # SAME results dataset -> its `knowledge/` subtree (default `path_in_repo`)
    # is synced down at run start and pushed back after a fix, so a new model run
    # replays a recorded auto_round/vllm fix before ever spending an agent tier.
    repo: ${LOCAL_RESULTS_DATASET:-lvkaokao/lb_local}
    token_env: LOCAL_RESULTS_HF_TOKEN   # write token for push (public read needs none)
    replay: true                        # try recorded patches before the agent
    push: true                          # upload new lessons/patches back to the repo

executor:
  type: ssh                    # --server 5000pro_7cards (direct CUDA machine)
  image:
    gpu: nvcr.io/nvidia/pytorch:26.01-py3  # NGC base image
    dockerfile: local          # --gpu-dockerfile local (independent Dockerfile)
  proxy:
    http_proxy: ${LOCAL_HTTP_PROXY:-}
    https_proxy: ${LOCAL_HTTPS_PROXY:-}
  ssh:
    host: ${GPU_HOST:-kaokao@5000pro-7cards}
    gpus: "5,6"                  # --gpus 5
    auth:
      method: password
      password_env: GPU_SSH_PASS   # export GPU_SSH_PASS='...' before running
    # direct machine -> no `jump:` hops

output:
  dir: ./results/qwen3.8-27B-w4a16-v2
  sinks:
    - type: local_fs
    - type: hf_dataset
      repo: ${LOCAL_RESULTS_DATASET:-lvkaokao/lb_local}
      token_env: LOCAL_RESULTS_HF_TOKEN
      request_filename: true   # embed the source request filename in each record
